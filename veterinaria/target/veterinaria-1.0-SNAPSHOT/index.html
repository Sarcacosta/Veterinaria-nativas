<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Login - Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        background-image: url('https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fimg.freepik.com%2Ffotos-premium%2Fequipo-medico-botiquin-primeros-auxilios-ilustracion-acuarela-plantilla-horizontal-coleccion-veterinaria-diseno-diseno-clinicas-hospitales-medicamentos-farmacias_617379-2370.jpg%3Fw%3D1380&f=1&nofb=1&ipt=8a5ca274b43aad82ab28848aea922d2b5599d3d3729a355fa451598df68fcc34'); /* Coloca el enlace de tu imagen */
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
      }
      .card {
        border-radius: 10px;
      }
      .card-header {
        font-size: 1.5rem;
        background-color: #005f6b;
        color: white;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
      }
      .card-body {
        background-color: rgba(255, 255, 255, 0.8);
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
      }
      .btn-primary {
        background-color: #006d77;
        border-color: #006d77;
      }
      .btn-primary:hover {
        background-color: #005f6b;
        border-color: #005f6b;
      }
      .form-control:focus {
        border-color: #005f6b;
        box-shadow: 0 0 5px rgba(0, 99, 107, 0.7);
      }
      #error {
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="card shadow">
            <div class="card-header text-center fw-bold">
              Plataforma Veterinaria
            </div>
            <div class="card-body">
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">Usuario</label>
                  <input type="text" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input type="password" id="password" class="form-control" required>
                </div>
                <div class="mb-3 form-check">
                  <input type="checkbox" class="form-check-input" id="rememberMe">
                  <label class="form-check-label" for="rememberMe">Recordarme</label>
                </div>
                <button class="btn btn-primary w-100">Ingresar</button>
              </form>
              <div id="error" class="text-danger mt-3 text-center"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
