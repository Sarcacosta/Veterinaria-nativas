plugins {
    id 'com.android.application' version '9.1.1'
}

android {
    namespace 'com.huella.acceso'
    compileSdk 34

    defaultConfig {
        applicationId 'com.huella.acceso'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
